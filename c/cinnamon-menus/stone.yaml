name        : cinnamon-menus
version     : 27
release     : 1
homepage    : https://github.com/linuxmint/cinnamon-menus
upstreams   :
    - https://github.com/linuxmint/cinnamon-menus/archive/refs/tags/master.mint27.tar.gz : e47b99b35148efbada8cc9810e70283d67fbea8e15e4df1fab687614baa57957
summary     : The cinnamon-menu library
description : |
    cinnamon-menus contains the libcinnamon-menu library, 
    the layout configuration files for the Cinnamon menu, 
    as well as a simple menu editor.
license     : GPL-2.0-only
builddeps   :
    - pkgconfig(gio-unix-2.0)
    - pkgconfig(gobject-introspection-1.0)
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
