name        : libtimezonemap
version     : "0.4.4"
release     : 1
homepage    : https://launchpad.net/timezonemap/trunk/0.4.4/+download
upstreams   :
    - https://launchpad.net/timezonemap/trunk/0.4.4/+download/libtimezonemap-0.4.4.tar.xz : a350b369e787edb154c84f9db945af0c57da0d56b007de526464d0217294e45f
