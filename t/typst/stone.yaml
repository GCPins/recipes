name        : typst
version     : "0.15.1"
release     : 1
homepage    : https://typst.app
upstreams   :
    - https://github.com/typst/typst/archive/refs/tags/v0.15.1.tar.gz : c07909e01a2a6941e52c9b616e48c209c755eed416d62bcf5583c37a4aca01a3
summary     : A powerful markup-based typesetting system that is easy to learn.
description : |
    A new markup-based typesetting system that is designed to be as
    powerful as LaTeX while being much easier to learn and use. It provides
    built-in markup for the most common formatting tasks, and flexible functions
    for everything else. It has tightly integrated scripting system, math typesetting,
    bibliography management, and friendly error messages in case something goes wrong.
license     : Apache-2.0
networking  : true
builddeps   :
    - pkgconfig(openssl)
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    %cargo_install
check       : |
    %cargo_test
